[project]
name = "meetings-back"
version = "0.1.0"
description = "Meetings App backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "mangum>=0.19",
    "pyjwt[crypto]>=2.9",
    # Weekly report Lambda: S3 writes, and a tz database the Lambda image does not ship.
    "boto3>=1.35",
    "tzdata>=2024.1",
    # Agenda parser Lambda: Claude on Bedrock through the Anthropic Messages API.
    "anthropic[bedrock]>=0.75",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` in argument defaults is idiomatic.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
