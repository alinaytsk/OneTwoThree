AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - weekly meetings report, event driven. EventBridge Scheduler puts a message on
  SQS every Monday; a builder Lambda inside the VPC writes the CSV to S3 through the gateway
  endpoint; the ObjectCreated notification invokes a mailer Lambda outside the VPC that sends it
  through SES. The split exists because the VPC has no NAT gateway, so nothing inside it can
  reach SES - see "Reaching SES" in README.

  Network and database values come from the backend stack outputs; the Makefile passes them.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources. Must match the backend stack.

  # --- From the backend stack (make aws-reports-stack reads these from its outputs) ---
  ImageUri:
    Type: String
    Description: >-
      Backend image URI including tag - the same image the API runs, started on a different
      command. e.g. <account>.dkr.ecr.<region>.amazonaws.com/meetings-backend:abc123.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Must match the platform the image was built for.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets of the backend VPC (backend stack output PrivateSubnetIds).
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Backend security group, the one the database accepts (output BackendSecurityGroupId).
  RouteTableId:
    Type: String
    Description: Private route table the S3 gateway endpoint attaches to (output PrivateRouteTableId).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Backend VPC (output VpcId).
  DbEndpoint:
    Type: String
    Description: Aurora writer endpoint (output DbEndpoint).
  DbPort:
    Type: String
    Default: "5432"
  DbName:
    Type: String
    Default: meetings
  DbUsername:
    Type: String
    Default: meetings
  DbSecretArn:
    Type: String
    Description: >-
      Secret holding the database password (output DbSecretArn). Resolved at deploy time into the
      function environment, like the API Lambda does, so the function needs no route to
      Secrets Manager.

  # --- Report settings ---
  BuilderTimeout:
    Type: Number
    Default: 120
    MinValue: 60
    MaxValue: 900
    Description: >-
      Seconds the builder may take. Needs room for Aurora to resume from 0 ACU (about 15 s) plus
      two weeks of queries.
  QueueVisibilityTimeout:
    Type: Number
    Default: 720
    Description: >-
      Must be 6x BuilderTimeout - the SQS rule for Lambda event sources. The Makefile computes it;
      do not set the two independently.
  ReportTimezone:
    Type: String
    Default: Europe/Kyiv
    Description: Timezone the ISO week boundaries are taken in (and that the schedule fires in).
  RetentionDays:
    Type: Number
    Default: 90
    Description: Days before a report object is deleted from the bucket.
  LogRetentionDays:
    Type: Number
    Default: 7

  # --- Mail ---
  MailFrom:
    Type: String
    Description: Sender address. Its domain or the address itself must be verified in SES.
  MailTo:
    Type: String
    Description: Comma-separated recipients. In the SES sandbox each one must be verified too.
  SesDomain:
    Type: String
    Default: ""
    Description: >-
      Domain to create an SES identity for, which emits the DKIM CNAME records to publish.
      Leave empty if the sender is verified by hand or the domain identity already exists.

Conditions:
  HasSesDomain: !Not [!Equals [!Ref SesDomain, ""]]

Resources:
  # =====================================================================
  # Storage
  # =====================================================================
  # The name is spelled out rather than generated, because the S3 notification below needs the
  # bucket ARN in a Lambda permission *before* the bucket exists. Account ID keeps it globally
  # unique without being a random suffix nobody can guess from the stack.
  ReportsBucket:
    Type: AWS::S3::Bucket
    # The notification can only be configured once S3 is allowed to invoke the mailer. Without
    # this the bucket would have to !GetAtt the function and the function !GetAtt the bucket.
    DependsOn: MailerInvokePermission
    Properties:
      BucketName: !Sub ${ProjectName}-reports-${AWS::AccountId}
      # Private: ACLs disabled, no public access, encrypted at rest. Reports name people.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: !Ref RetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: reports/ }
                  - { Name: suffix, Value: .csv }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-reports" }
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Nothing but the two roles in this stack may touch the bucket, over TLS only.
  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}
              - !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/*
            Condition:
              Bool: { "aws:SecureTransport": false }

  # The builder has no internet route, so S3 is reached over a gateway endpoint: a prefix-list
  # route in the private route table, free of charge, no NAT gateway.
  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RouteTableId]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}
              - !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/*

  # =====================================================================
  # Queue: the Scheduler writes here, the builder reads
  # =====================================================================
  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests-dlq
      MessageRetentionPeriod: 1209600 # 14 days, the maximum - a failed Monday stays inspectable
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests
      # A Lambda event source needs the visibility timeout to be at least the function timeout;
      # 6x is what AWS recommends, so a slow run is not redelivered while it is still working.
      VisibilityTimeout: !Ref QueueVisibilityTimeout
      MessageRetentionPeriod: 345600 # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =====================================================================
  # Builder Lambda: backend image, inside the VPC, writes the CSV to S3
  # =====================================================================
  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-report-builder
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs plus the network interfaces Lambda needs to join the VPC.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: write-reports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # PutObject writes the report; GetObject covers the HeadObject that makes a rerun
              # a no-op. Only under reports/, and only this bucket.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              # Without ListBucket, S3 answers HeadObject on a key that does not exist with 403
              # rather than 404 - it will not reveal whether an object exists to a caller that
              # cannot list the bucket. The rerun check reads that 404, so the builder needs this
              # to tell "no report yet" from a real permission problem. Bucket ARN, not /*:
              # ListBucket is a bucket-level action.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}
        - PolicyName: consume-report-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-report-builder
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        # Same image as the API, different entry point.
        Command: [app.reports.lambda_handler.handler]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      Timeout: !Ref BuilderTimeout
      Role: !GetAtt BuilderRole.Arn
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      # In the VPC because the meetings database is; S3 is reached over the gateway endpoint.
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
      Environment:
        Variables:
          REPORTS_BUCKET: !Sub ${ProjectName}-reports-${AWS::AccountId}
          REPORT_TIMEZONE: !Ref ReportTimezone
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUsername
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbSecretArn}:SecretString:password}}"
          # Close connections after each run so Aurora can pause again.
          DB_NULL_POOL: "true"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref BuilderFunction
      # One report per invocation: a batch would hide which week failed, and a partial batch
      # failure would rebuild weeks that already succeeded.
      BatchSize: 1
      Enabled: true

  # =====================================================================
  # Schedule: Monday 07:00 Europe/Kyiv -> a message on the queue
  # =====================================================================
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            # Keeps any other account from using this role through the Scheduler service.
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: send-report-request
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-weekly-report
      Description: Monday 07:00 Kyiv - queue a report for the week that just ended.
      State: ENABLED
      ScheduleExpression: cron(0 7 ? * MON *)
      # Named zone, not a UTC offset, so the hour stays 07:00 across the DST change.
      ScheduleExpressionTimezone: !Ref ReportTimezone
      FlexibleTimeWindow:
        # The report is cheap and nobody else contends for the hour; run it on the minute.
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        # The queue is the target rather than the function: a retry, a DLQ and a manual
        # `make report-now` all come for free, and the schedule never waits on a cold Aurora.
        # No "week" key - the builder reports the week that just ended.
        Input: '{"source": "schedule"}'
        RetryPolicy:
          MaximumRetryAttempts: 3

  # =====================================================================
  # Mailer Lambda: outside the VPC (it needs SES), outside the backend image
  # =====================================================================
  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-report-mailer
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs only - no VPC access execution role, this function is not in the VPC.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-reports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read-only, and only under reports/: the mailer must not be able to write back
              # into the prefix that invokes it.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
        - PolicyName: send-mail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
                Condition:
                  StringEquals: { "ses:FromAddress": !Ref MailFrom }
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-report-mailer
      Runtime: python3.12
      Handler: report_mailer.handler
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt MailerRole.Arn
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      # No VpcConfig on purpose: SES has no gateway endpoint and the VPC has no NAT gateway.
      Code:
        # Placeholder. The real handler is infra/lambda/report_mailer.py, uploaded by
        # `make aws-reports-mailer-code` - inline code is capped at 4 KB, and the source is
        # easier to review as a file. Re-run that target after every stack update, because
        # CloudFormation restores this placeholder each time.
        ZipFile: |
          def handler(event, context):
              raise RuntimeError("placeholder code: run `make aws-reports-mailer-code`")
      Environment:
        Variables:
          MAIL_FROM: !Ref MailFrom
          MAIL_TO: !Ref MailTo
          MAIL_SUBJECT_PREFIX: !Sub "[${ProjectName}] Weekly meetings report"
          REPORT_PREFIX: reports/
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # S3 is allowed to invoke the mailer. SourceArn is built from the spelled-out bucket name, not
  # !GetAtt ReportsBucket.Arn: the bucket depends on this permission, so referencing the bucket
  # here would close the loop into a circular dependency.
  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MailerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}

  # =====================================================================
  # SES identity
  # =====================================================================
  # Creating the identity returns three DKIM CNAME records that have to be published in the
  # domain's DNS by hand (see README); until they resolve, the identity stays unverified and
  # SES refuses to send. A brand new account is also in the SES sandbox, where every recipient
  # must be verified separately.
  MailDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasSesDomain
    Properties:
      EmailIdentity: !Ref SesDomain
      DkimAttributes:
        SigningEnabled: true

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket
  ReportRequestsQueueUrl:
    Description: Queue `make report-now WEEK=...` sends to.
    Value: !Ref ReportRequestsQueue
  ReportRequestsQueueArn:
    Value: !GetAtt ReportRequestsQueue.Arn
  ReportRequestsDlqUrl:
    Description: Where a report that failed three times ends up.
    Value: !Ref ReportRequestsDlq
  BuilderFunctionName:
    Value: !Ref BuilderFunction
  MailerFunctionName:
    Value: !Ref MailerFunction
  BuilderLogGroupName:
    Value: !Ref BuilderLogGroup
  MailerLogGroupName:
    Value: !Ref MailerLogGroup
  ScheduleName:
    Value: !Ref WeeklySchedule
  DkimRecordsHint:
    Condition: HasSesDomain
    Description: Where to read the DKIM CNAME records to publish by hand.
    Value: !Sub "aws sesv2 get-email-identity --email-identity ${SesDomain} --query DkimAttributes.Tokens"
