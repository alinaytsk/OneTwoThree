AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - backend on AWS Lambda (container image) behind a public function URL,
  PostgreSQL on Aurora Serverless v2 that scales to zero. No NAT gateway, no load balancer.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.

  # --- Backend (Lambda) ---
  ImageUri:
    Type: String
    Description: Full backend image URI including tag, e.g. <account>.dkr.ecr.<region>.amazonaws.com/meetings-backend:abc123.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Must match the platform the image was built for. arm64 (Graviton) is ~20% cheaper.
  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Lambda memory in MB (CPU scales with it).
  Timeout:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900
    Description: >-
      Seconds per request. Leave room for Aurora to resume from 0 ACU (about 15 s) on the first request.
  CorsOrigins:
    Type: String
    Default: http://localhost:3000,http://localhost:5173
    Description: Comma-separated browser origins allowed to call the API (the Makefile adds the frontend's).
  Seed:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Insert sample participants when migrations run and the table is empty.
  LogRetentionDays:
    Type: Number
    Default: 7

  # --- Auth (from the Cognito stack; the Makefile passes them) ---
  CognitoUserPoolId:
    Type: String
    Description: User pool whose ID tokens the API accepts.
  CognitoClientId:
    Type: String
    Description: App client the tokens must be issued to (their aud claim).
  CognitoJwks:
    Type: String
    Description: >-
      The pool's public signing keys (JWKS JSON). Passed in because the function has no internet
      route to download them; Cognito does not rotate user pool keys.

  # --- Database (Aurora Serverless v2, PostgreSQL) ---
  DbEngineVersion:
    Type: String
    Default: "16.14"
    Description: Aurora PostgreSQL version; scaling to 0 ACU needs 13.15+, 14.12+, 15.7+ or 16.3+.
  DbMinCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 256
    Description: Minimum ACUs. 0 lets the database pause when idle, so you pay only for storage.
  DbMaxCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 256
    Description: Maximum ACUs (1 ACU is about 2 GiB of memory).
  DbSecondsUntilAutoPause:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
    Description: Idle seconds without connections before the database pauses (only when DbMinCapacity is 0).
  DbName:
    Type: String
    Default: meetings
  DbUsername:
    Type: String
    Default: meetings
  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35

Resources:
  # =====================================================================
  # Network: two private subnets (Aurora needs two AZs). Nothing here is reachable from the
  # internet; the function URL is served by the Lambda service, not from inside the VPC.
  # =====================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-vpc" }
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 2, 8]]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private-1" }
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 2, 8]]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private-2" }
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # An explicit route table instead of the VPC's main one: a gateway VPC endpoint has to be
  # attached to route tables by ID, and the main route table has no ID this stack can hand out.
  # It carries only the local route, exactly like the main table it replaces for these subnets.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private" }
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PrivateSubnet1RouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # --- Security groups ---
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend Lambda - outbound to the database only
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-backend" }
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL - only from the backend Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref BackendSecurityGroup }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-db" }
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =====================================================================
  # Database
  # =====================================================================
  # Generated once; resolved at deploy time into the cluster and the function's environment,
  # so the Lambda needs no route to Secrets Manager (and the VPC no NAT gateway or endpoint).
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      Description: !Sub Master credentials of the ${ProjectName} Aurora cluster
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      DBSubnetGroupDescription: !Sub ${ProjectName} database subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  DbCluster:
    Type: AWS::RDS::DBCluster
    # A final snapshot is kept when the stack is deleted.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      DBClusterIdentifier: !Sub ${ProjectName}-db
      Engine: aurora-postgresql
      EngineVersion: !Ref DbEngineVersion
      DatabaseName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      StorageEncrypted: true
      CopyTagsToSnapshot: true
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      DeletionProtection: false
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DbMinCapacity
        MaxCapacity: !Ref DbMaxCapacity
        SecondsUntilAutoPause: !Ref DbSecondsUntilAutoPause

  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      DBInstanceIdentifier: !Sub ${ProjectName}-db-1
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false

  # =====================================================================
  # Lambda
  # =====================================================================
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      LogGroupName: !Sub /aws/lambda/${ProjectName}-backend
      RetentionInDays: !Ref LogRetentionDays

  # Logs and the network interfaces Lambda needs to join the VPC; the app needs nothing else
  # (tokens are verified with the JWKS from the environment, without calling Cognito).
  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  BackendFunction:
    Type: AWS::Lambda::Function
    # The function is usable only once the database instance exists.
    DependsOn: DbInstance
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      FunctionName: !Sub ${ProjectName}-backend
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [!Ref Architecture]
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Role: !GetAtt BackendRole.Arn
      LoggingConfig:
        LogGroup: !Ref BackendLogGroup
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        SecurityGroupIds: [!Ref BackendSecurityGroup]
      Environment:
        Variables:
          DB_HOST: !GetAtt DbCluster.Endpoint.Address
          DB_PORT: !GetAtt DbCluster.Endpoint.Port
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUsername
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
          # Close connections after each request: Aurora pauses only when none are open.
          DB_NULL_POOL: "true"
          CORS_ORIGINS: !Ref CorsOrigins
          SEED: !Ref Seed
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks

  # Public HTTPS endpoint of the function; this is the backend URL the frontend is built with.
  BackendFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref BackendFunction
      AuthType: NONE

  # A public function URL needs both permissions.
  BackendFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  BackendFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Backend base URL (Lambda function URL); API routes live under /api.
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
  ApiDocsUrl:
    Description: Swagger UI of the deployed backend.
    Value: !Sub "${BackendFunctionUrl.FunctionUrl}api/docs"
  FunctionName:
    Value: !Ref BackendFunction
  LogGroupName:
    Value: !Ref BackendLogGroup
  DbEndpoint:
    Description: Aurora writer endpoint (reachable only from inside the VPC).
    Value: !GetAtt DbCluster.Endpoint.Address
  DbPort:
    Value: !GetAtt DbCluster.Endpoint.Port
  DbName:
    Description: Database the application uses.
    Value: !Ref DbName
  DbUsername:
    Description: Database user the application connects as.
    Value: !Ref DbUsername
  DbSecretArn:
    Description: Secrets Manager secret with the database master credentials.
    Value: !Ref DbSecret

  # --- Network, for stacks that put more Lambdas next to this one (infra/reports.yml) ---
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Description: Comma-separated private subnets to place VPC-attached Lambdas in.
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
  BackendSecurityGroupId:
    Description: Security group allowed to reach the database.
    Value: !Ref BackendSecurityGroup
  PrivateRouteTableId:
    Description: Route table of the private subnets; gateway VPC endpoints attach to it.
    Value: !Ref PrivateRouteTable
