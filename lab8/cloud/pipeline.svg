<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="420" fill="#ffffff"/>

  <text x="28" y="40" font-size="20" font-weight="600" fill="#111827">
    Payments through a cloud pipeline
  </text>
  <text x="28" y="62" font-size="13" fill="#6b7280">
    One shard, two readers: the Lambda answers in seconds and forgets, Firehose writes everything down.
  </text>

  <!-- producer -->
  <rect x="28" y="150" width="140" height="66" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="98" y="177" font-size="13" font-weight="600" text-anchor="middle" fill="#312e81">producer.py</text>
  <text x="98" y="196" font-size="11" text-anchor="middle" fill="#4338ca">payment webhooks</text>

  <!-- kinesis -->
  <rect x="236" y="142" width="150" height="82" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="311" y="168" font-size="13" font-weight="600" text-anchor="middle" fill="#78350f">Kinesis stream</text>
  <text x="311" y="186" font-size="11" text-anchor="middle" fill="#92400e">lab8-payments-stream</text>
  <text x="311" y="203" font-size="11" text-anchor="middle" fill="#92400e">1 shard</text>
  <text x="311" y="218" font-size="10" text-anchor="middle" fill="#b45309">key = invoiceId</text>

  <!-- lambda -->
  <rect x="470" y="58" width="168" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="554" y="84" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">Lambda</text>
  <text x="554" y="102" font-size="11" text-anchor="middle" fill="#991b1b">failure rate per method</text>
  <text x="554" y="119" font-size="10" text-anchor="middle" fill="#b91c1c">batch of 500 or 30 s</text>

  <!-- sns -->
  <rect x="700" y="58" width="130" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="90" font-size="13" font-weight="600" text-anchor="middle" fill="#7f1d1d">SNS topic</text>
  <text x="765" y="110" font-size="11" text-anchor="middle" fill="#991b1b">alert above 10%</text>

  <!-- email -->
  <rect x="872" y="70" width="80" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="912" y="101" font-size="12" text-anchor="middle" fill="#374151">email</text>

  <!-- firehose -->
  <rect x="470" y="248" width="168" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="554" y="274" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">Firehose</text>
  <text x="554" y="292" font-size="11" text-anchor="middle" fill="#166534">buffers 5 MB or 60 s</text>
  <text x="554" y="309" font-size="10" text-anchor="middle" fill="#15803d">records need a trailing \n</text>

  <!-- s3 -->
  <rect x="700" y="248" width="130" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="765" y="274" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">S3</text>
  <text x="765" y="293" font-size="10" text-anchor="middle" fill="#166534">stream/raw/</text>
  <text x="765" y="309" font-size="10" text-anchor="middle" fill="#166534">dt=yyyy-MM-dd/</text>

  <!-- athena -->
  <rect x="872" y="248" width="80" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="912" y="280" font-size="12" font-weight="600" text-anchor="middle" fill="#075985">Athena</text>
  <text x="912" y="299" font-size="10" text-anchor="middle" fill="#0369a1">stream_</text>
  <text x="912" y="312" font-size="10" text-anchor="middle" fill="#0369a1">events</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 168 183 L 230 183"/>
    <path d="M 386 170 C 430 170, 430 96, 464 96"/>
    <path d="M 386 196 C 430 196, 430 286, 464 286"/>
    <path d="M 638 96 L 694 96"/>
    <path d="M 830 96 L 866 96"/>
    <path d="M 638 286 L 694 286"/>
    <path d="M 830 286 L 866 286"/>
  </g>

  <text x="402" y="128" font-size="10" fill="#6b7280">real time</text>
  <text x="400" y="243" font-size="10" fill="#6b7280">everything, batched</text>

  <text x="28" y="372" font-size="11" fill="#6b7280">
    Measured: 5 000 events at 174/s, 0 rejected by Kinesis · 39 alerts published · one 2.0 MiB object in S3
  </text>
  <text x="28" y="392" font-size="11" fill="#6b7280">
    Athena over the streamed events: 2.00 MB scanned, 0.90 s · everything billed by the hour was deleted afterwards
  </text>
</svg>
