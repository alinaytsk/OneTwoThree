# Redpanda is Kafka's protocol without Kafka's operational weight: one binary, no
# ZooKeeper, no JVM. The producer and consumer talk to it with an ordinary Kafka client
# and cannot tell the difference.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: lab8-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      # Two listeners: one for containers on this network, one for the laptop.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  console:
    image: redpandadata/console:v2.7.2
    container_name: lab8-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
